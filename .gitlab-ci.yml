image: maven:3.9.6-eclipse-temurin-21
stages:
  - build
  - test
  - deploy
cache:
  paths:
    - .m2/repository
build_job:
  stage: build
  script:
    - echo "Bắt đầu compile mã nguồn và đóng gói với Java 21..."
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 hour
test_job:
  stage: test
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_DB: banking_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_HOST_AUTH_METHOD: trust
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/banking_test
    SPRING_DATASOURCE_USERNAME: postgres
    SPRING_DATASOURCE_PASSWORD: postgres
  script:
    - echo "Bắt đầu chạy Unit Test..."
    - sleep 10
    - mvn test
deploy_job:
  stage: deploy
  image: alpine:latest # use Linux OS smooth
  before_script:
    # 1. install ssh tool
    - apk add --no-cache openssh-client
    # 2. create ssh key file from Gitlab secure variable
    - mkdir -p ~/.ssh
    - echo "$EC2_SSH_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    # 3. disable the question "Are you sure you want to continue connecting"
    - ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts
  script:
    - echo "start copy .jar file to AWS EC2..."
    # 4. copy file .jar from GitLab to EC2 by SCP
    - scp target/*.jar $EC2_USERNAME@$EC2_HOST:~/banking-backend.jar
    
    - echo "start to restart the system on EC2..."
    # 5. log in to EC2, turn off the old app (if running), and turn on the new app to run in the background (nohup)
    - |
      ssh $EC2_USERNAME@$EC2_HOST "
        pkill -f 'java -jar' || true
        nohup java -jar ~/banking-backend.jar > app.log 2>&1 &
      "
    - echo "deploy successfully! System is running."