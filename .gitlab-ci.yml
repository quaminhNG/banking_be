image: maven:3.9.6-eclipse-temurin-21
stages:
  - build
  - test
  - deploy
cache:
  paths:
    - .m2/repository
build_job:
  stage: build
  script:
    - echo "Bắt đầu compile mã nguồn và đóng gói với Java 21..."
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 hour
test_job:
  stage: test
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_DB: banking_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_HOST_AUTH_METHOD: trust
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/banking_test
    SPRING_DATASOURCE_USERNAME: postgres
    SPRING_DATASOURCE_PASSWORD: postgres
  script:
    - echo "Bắt đầu chạy Unit Test..."
    - sleep 10
    - mvn test
deploy_job:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$EC2_SSH_KEY" > ~/.ssh/id_rsa
    - chmod 400 ~/.ssh/id_rsa

    - echo "===== CHECK SSH KEY ====="
    - head -n 2 ~/.ssh/id_rsa
    - tail -n 2 ~/.ssh/id_rsa

    - echo "===== TEST SSH ====="
    - ssh -v -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no $EC2_USERNAME@$EC2_HOST "echo connected"
  script:
    - echo "1. Dừng hệ thống cũ đang chạy trên EC2..."
    - ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no $EC2_USERNAME@$EC2_HOST "pkill -f banking-backend.jar || true"
    
    - echo "2. Chuyển file .jar cập nhật lên máy chủ..."
    - ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no $EC2_USERNAME@$EC2_HOST "rm -f ~/banking-backend.jar"
    - scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no target/*.jar $EC2_USERNAME@$EC2_HOST:~/banking-backend.jar
    
    - echo "3. Khởi động hệ thống mới..."
    - ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no $EC2_USERNAME@$EC2_HOST "nohup java -jar ~/banking-backend.jar > app.log 2>&1 < /dev/null & sleep 3"
    
    - echo "start the new app successfully!"